<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Padare Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f8;
            color: #24343d;
        }

        /* HEADER */

        .header {
            background: #075985;
            color: white;
            padding: 20px 30px;
        }

        .header-inner {
            width: min(1200px, 94%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand h1 {
            font-family: Georgia, serif;
            font-size: 1.5rem;
        }

        .brand p {
            margin-top: 5px;
            opacity: .8;
            font-size: .85rem;
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,.5);
            background: transparent;
            color: white;

            padding: 10px 18px;
            border-radius: 20px;

            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: white;
            color: #075985;
        }

        /* MAIN */

        .container {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }

        .stat span {
            display: block;
            color: #65747c;
            margin-bottom: 8px;
            font-size: .9rem;
        }

        .stat strong {
            font-size: 2rem;
            color: #075985;
        }

        /* MESSAGES */

        .messages {
            background: white;
            border-radius: 15px;
            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }

        .messages-header {
            padding: 22px;

            border-bottom: 1px solid #eee;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-header h2 {
            color: #075985;
            font-size: 1.2rem;
        }

        .refresh-btn {
            border: none;
            background: #075985;
            color: white;

            padding: 10px 18px;
            border-radius: 20px;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #064b70;
        }

        /* MESSAGE */

        .message {
            padding: 22px;
            border-bottom: 1px solid #eee;
        }

        .message:last-child {
            border-bottom: none;
        }

        .message.unread {
            background: #f0f8fc;
            border-left: 5px solid #d6a62d;
        }

        .message-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .message-name {
            font-weight: bold;
            color: #075985;
            font-size: 1.05rem;
        }

        .message-email {
            margin-top: 4px;
            color: #65747c;
            font-size: .9rem;
        }

        .message-phone {
            margin-top: 3px;
            color: #65747c;
            font-size: .85rem;
        }

        .message-subject {
            margin-top: 12px;
            font-weight: bold;
            color: #24343d;
        }

        .message-body {
            margin-top: 8px;
            color: #53636b;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-date {
            margin-top: 12px;
            color: #89959a;
            font-size: .8rem;
        }

        /* ACTIONS */

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .actions button {
            border: none;
            padding: 8px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .read-btn {
            background: #e8f3f7;
            color: #075985;
        }

        .reply-btn {
            background: #e8f3f7;
            color: #075985;
        }

        .whatsapp-btn {
            background: #eaf7ee;
            color: #247a45;
        }

        .delete-btn {
            background: #fbe9e7;
            color: #b42318;
        }

        .actions button:hover {
            opacity: .8;
        }

        /* STATUS */

        .empty {
            padding: 50px;
            text-align: center;
            color: #65747c;
        }

        .error {
            padding: 30px;
            text-align: center;
            color: #b42318;
            background: #fff5f4;
        }

        .login-link {
            display: inline-block;

            margin-top: 15px;

            padding: 10px 18px;

            border-radius: 20px;

            background: #075985;
            color: white;

            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header-inner {
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .messages-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .message-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <h1>
                PADARE Admin Dashboard
            </h1>

            <p>
                Breaking the Silence – Zambia
            </p>

        </div>


        <button
            type="button"
            class="logout-btn"
            id="logoutButton">

            Logout

        </button>

    </div>

</header>


<!-- MAIN -->

<main class="container">


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat">

            <span>
                Total Messages
            </span>

            <strong id="totalMessages">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Unread Messages
            </span>

            <strong id="unreadMessages">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Read Messages
            </span>

            <strong id="readMessages">
                0
            </strong>

        </div>

    </section>


    <!-- MESSAGES -->

    <section class="messages">

        <div class="messages-header">

            <h2>
                Contact Messages
            </h2>

            <button
                type="button"
                class="refresh-btn"
                id="refreshButton">

                Refresh

            </button>

        </div>


        <div id="messagesList">

            <div class="empty">
                Loading messages...
            </div>

        </div>

    </section>

</main>


<script>

"use strict";


// ==========================================
// TOKEN
// ==========================================

function getToken() {

    return localStorage.getItem(
        "padareAdminToken"
    );

}


// ==========================================
// REDIRECT IF NOT LOGGED IN
// ==========================================

const token = getToken();

if (!token) {

    window.location.replace(
        "/dashboard/login.html"
    );

}


// ==========================================
// ELEMENTS
// ==========================================

const messagesList =
    document.getElementById(
        "messagesList"
    );

const totalMessages =
    document.getElementById(
        "totalMessages"
    );

const unreadMessages =
    document.getElementById(
        "unreadMessages"
    );

const readMessages =
    document.getElementById(
        "readMessages"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


// ==========================================
// LOGOUT
// ==========================================

logoutButton.addEventListener(
    "click",
    function () {

        localStorage.removeItem(
            "padareAdminToken"
        );

        window.location.replace(
            "/dashboard/login.html"
        );

    }
);


// ==========================================
// API REQUEST
// ==========================================

async function apiRequest(
    url,
    options = {}
) {

    const currentToken =
        getToken();


    if (!currentToken) {

        window.location.replace(
            "/dashboard/login.html"
        );

        return null;

    }


    const response =
        await fetch(
            url,
            {

                ...options,

                headers: {

                    "Authorization":
                        `Bearer ${currentToken}`,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})

                }

            }
        );


    if (response.status === 401) {

        localStorage.removeItem(
            "padareAdminToken"
        );

        window.location.replace(
            "/dashboard/login.html"
        );

        return null;

    }


    return response;

}


// ==========================================
// LOAD MESSAGES
// ==========================================

async function loadMessages() {

    messagesList.innerHTML = `
        <div class="empty">
            Loading messages...
        </div>
    `;


    try {

        const response =
            await apiRequest(
                "/api/messages"
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!response.ok ||
            !result.success) {

            throw new Error(
                result.message ||
                "Unable to load messages."
            );

        }


        const messages =
            Array.isArray(result.data)
                ? result.data
                : [];


        updateStats(messages);


        if (messages.length === 0) {

            messagesList.innerHTML = `
                <div class="empty">
                    No messages yet.
                </div>
            `;

            return;

        }


        messagesList.innerHTML =
            messages
                .map(
                    createMessageHTML
                )
                .join("");


    } catch (error) {

        console.error(
            "Load messages error:",
            error
        );


        messagesList.innerHTML = `

            <div class="error">

                <strong>
                    Failed to load messages.
                </strong>

                <p style="margin-top:8px;">
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


// ==========================================
// CREATE MESSAGE
// ==========================================

function createMessageHTML(
    message
) {

    const date =
        message.createdAt
            ? new Date(
                message.createdAt
            ).toLocaleString()
            : "";


    const safeId =
        escapeHTML(
            message._id
        );


    const phone =
        message.phone || "";


    return `

        <article
            class="message ${
                message.status === "unread"
                    ? "unread"
                    : ""
            }">


            <div class="message-top">

                <div>

                    <div class="message-name">
                        ${escapeHTML(
                            message.name
                        )}
                    </div>


                    <div class="message-email">
                        ${escapeHTML(
                            message.email
                        )}
                    </div>


                    ${
                        phone
                            ? `
                                <div class="message-phone">
                                    Phone:
                                    ${escapeHTML(phone)}
                                </div>
                            `
                            : ""
                    }

                </div>

            </div>


            <div class="message-subject">

                ${escapeHTML(
                    message.subject
                )}

            </div>


            <div class="message-body">

                ${escapeHTML(
                    message.message
                )}

            </div>


            <div class="message-date">

                Received:
                ${escapeHTML(date)}

            </div>


            <div class="actions">


                ${
                    message.status === "unread"

                        ? `
                            <button
                                type="button"
                                class="read-btn"
                                onclick="markRead('${safeId}')">

                                Mark as Read

                            </button>
                        `

                        : ""
                }


                <button
                    type="button"
                    class="reply-btn"
                    onclick="replyEmail('${escapeHTML(
                        message.email
                    )}')">

                    Reply by Email

                </button>


                ${
                    phone

                        ? `
                            <button
                                type="button"
                                class="whatsapp-btn"
                                onclick="replyWhatsApp('${escapeHTML(
                                    phone
                                )}')">

                                WhatsApp

                            </button>
                        `

                        : ""
                }


                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteMessage('${safeId}')">

                    Delete

                </button>

            </div>


        </article>

    `;

}


// ==========================================
// UPDATE STATS
// ==========================================

function updateStats(messages) {

    const total =
        messages.length;


    const unread =
        messages.filter(
            message =>
                message.status === "unread"
        ).length;


    const read =
        messages.filter(
            message =>
                message.status === "read"
        ).length;


    totalMessages.textContent =
        total;

    unreadMessages.textContent =
        unread;

    readMessages.textContent =
        read;

}


// ==========================================
// MARK AS READ
// ==========================================

async function markRead(id) {

    try {

        const response =
            await apiRequest(
                `/api/messages/${encodeURIComponent(id)}/read`,
                {
                    method: "PATCH"
                }
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!response.ok ||
            !result.success) {

            throw new Error(
                result.message ||
                "Unable to mark message as read."
            );

        }


        await loadMessages();


    } catch (error) {

        console.error(
            "Mark read error:",
            error
        );

        alert(
            "Unable to mark message as read."
        );

    }

}


// ==========================================
// DELETE
// ==========================================

async function deleteMessage(id) {

    if (
        !confirm(
            "Are you sure you want to delete this message?"
        )
    ) {

        return;

    }


    try {

        const response =
            await apiRequest(
                `/api/messages/${encodeURIComponent(id)}`,
                {
                    method: "DELETE"
                }
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!response.ok ||
            !result.success) {

            throw new Error(
                result.message ||
                "Unable to delete message."
            );

        }


        await loadMessages();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Unable to delete message."
        );

    }

}


// ==========================================
// EMAIL REPLY
// ==========================================

function replyEmail(email) {

    window.location.href =
        `mailto:${email}`;

}


// ==========================================
// WHATSAPP REPLY
// ==========================================

function replyWhatsApp(phone) {

    let number =
        String(phone)
            .replace(/\D/g, "");


    if (number.startsWith("0")) {

        number =
            "260" +
            number.substring(1);

    }


    window.open(
        `https://wa.me/${number}`,
        "_blank"
    );

}


// ==========================================
// REFRESH
// ==========================================

refreshButton.addEventListener(
    "click",
    loadMessages
);


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ==========================================
// START
// ==========================================

loadMessages();

</script>


</body>

</html>
